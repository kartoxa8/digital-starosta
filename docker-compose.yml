version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: digital_starosta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: starosta_user
      POSTGRES_PASSWORD: starosta_secure_password
      POSTGRES_DB: digital_starosta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starosta_user -d digital_starosta"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: digital_starosta_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://starosta_user:starosta_secure_password@db:5432/digital_starosta
      - BOT_TOKEN=${BOT_TOKEN:-replace-me}
      - WEBAPP_BASE_URL=${WEBAPP_BASE_URL:-http://localhost:8000}
      - CHECKIN_RADIUS_METERS=150
    ports:
      - "8000:8000"

volumes:
  postgres_data:
